name: PHP compatibility

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl
          tools: composer:v2
          coverage: none
        env:
          update: true
          fail-fast: true

      - name: Strict PHP runtime, syntax and regression tests
        shell: bash
        run: bash scripts/test-php-version.sh "$(command -v php)" "${{ matrix.php }}"

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install as Composer package (without development tools)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Check actual Composer runtime requirements
        run: composer check-platform-reqs --no-dev

      - name: Smoke-test PSR-4 autoload in a consumer
        shell: bash
        run: |
          php -d display_errors=stderr -d error_reporting=-1 -r '
            require "vendor/autoload.php";
            $taxId = TaxId\TaxIdFactory::create();
            if (!$taxId->validate("ES", "12345678Z")->isValid()) {
                throw new RuntimeException("PSR-4 consumer smoke test failed.");
            }
            echo "OK: consumer autoload and Spanish tax ID validation", PHP_EOL;
          '

      - name: Full release quality audit (Composer, static analysis, consumer)
        shell: bash
        run: bash scripts/audit-release-version.sh "$(command -v php)" "${{ matrix.php }}"

      - name: Upload PHP and quality test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxid-php-${{ matrix.php }}-test-results
          path: |
            var/test-results/php-${{ matrix.php }}.log
            var/test-results/php-${{ matrix.php }}-quality.log
          if-no-files-found: warn
          retention-days: 30
